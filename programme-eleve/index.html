<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Programme élève · Booty Flow</title>
  <meta name="theme-color" content="#0E0420" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet" />

  <style>
    /* =================================================================
       BOOTY FLOW · PROGRAMME ÉLÈVE · couleurs principales ici
       Mise en page : une feuille A4 sombre par bloc, cartes néon pour
       chaque séance, tableau d'exercices lisible à l'impression.
       ================================================================= */
    :root {
      --nuit: #0E0420;
      --nuit-2: #160831;
      --carte: #1D0D3A;
      --carte-2: #261148;
      --bord: rgba(180, 92, 255, .30);
      --violet: #7B2CE0;
      --neon: #B45CFF;
      --neon-clair: #D8A8FF;
      --rose: #E25CFF;
      --texte: #F3ECFF;
      --texte-doux: #C2B2DE;
      --texte-pale: #9786B5;
      --vert: #5BE3A5;
      --ambre: #FFC46B;
      --titre: "Playfair Display", Georgia, serif;
      --corps: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --rayon: 18px;
      --lueur: 0 0 0 1px rgba(180, 92, 255, .45), 0 0 18px rgba(180, 92, 255, .35), 0 0 50px -12px rgba(226, 92, 255, .45);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; background: var(--nuit); }
    body {
      margin: 0;
      font-family: var(--corps);
      font-size: 15px;
      line-height: 1.5;
      color: var(--texte);
      background:
        radial-gradient(900px 500px at 85% -5%, rgba(180, 92, 255, .28), transparent 60%),
        radial-gradient(700px 500px at -10% 30%, rgba(123, 44, 224, .22), transparent 60%),
        var(--nuit);
      background-attachment: fixed;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-block: 0 60px;
    }
    :focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; border-radius: 6px; }

    /* ---------- Barre d'outils ---------- */
    .outils {
      position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
      max-width: 1000px; margin: 0 auto 26px; padding: 12px 14px;
      background: rgba(22, 8, 49, .88); backdrop-filter: blur(10px);
      border: 1px solid var(--bord); border-top: 0; border-radius: 0 0 16px 16px;
    }
    .outils .astuce { flex-basis: 100%; text-align: center; color: var(--texte-pale); font-size: 12.5px; }
    .btn {
      appearance: none; border: 1px solid var(--bord); background: var(--carte);
      color: var(--texte); font: 600 13.5px var(--corps); padding: 9px 14px; border-radius: 999px;
      cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .15s;
    }
    .btn:hover { border-color: var(--neon); box-shadow: 0 0 14px rgba(180, 92, 255, .4); }
    .btn:active { transform: scale(.97); }
    .btn.principal { background: linear-gradient(135deg, var(--violet), var(--rose)); border-color: transparent; }
    .btn.actif { background: var(--vert); color: #0b2a1c; border-color: transparent; }
    .btn.petit { padding: 6px 11px; font-size: 12.5px; }
    .btn.danger:hover { border-color: #ff6b8b; box-shadow: 0 0 12px rgba(255, 107, 139, .45); }
    .btn.icone { width: 30px; height: 30px; padding: 0; display: inline-grid; place-items: center; font-size: 14px; }

    /* ---------- Document ---------- */
    .doc { max-width: 1000px; margin: 0 auto; display: grid; gap: 26px; }
    .doc > * { min-width: 0; }

    .entete {
      position: relative; overflow: hidden;
      display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 26px; align-items: center;
      padding: 28px; border-radius: 26px;
      background: linear-gradient(140deg, rgba(123, 44, 224, .35), rgba(14, 4, 32, .2) 55%), var(--carte);
      box-shadow: var(--lueur);
    }
    .entete .logo { width: 100%; border-radius: 16px; display: block; box-shadow: 0 0 30px rgba(180, 92, 255, .35); }
    .surtitre { text-transform: uppercase; letter-spacing: .18em; font-size: 12px; font-weight: 700; color: var(--neon-clair); }
    .entete h1 {
      font-family: var(--titre); font-style: italic; font-size: clamp(30px, 5vw, 46px); line-height: 1.05;
      margin: 8px 0 10px; text-wrap: balance;
      text-shadow: 0 0 18px rgba(216, 168, 255, .55);
    }
    .entete .sous { color: var(--texte-doux); font-size: 17px; margin: 0; }
    .eleve { display: inline-flex; gap: 8px; align-items: baseline; margin-top: 16px; padding: 8px 14px; border-radius: 999px; background: rgba(14, 4, 32, .55); border: 1px solid var(--bord); }
    .eleve b { font-family: var(--titre); font-style: italic; font-size: 19px; color: var(--neon-clair); }
    .eleve span { color: var(--texte-pale); font-size: 13px; }

    .bloc { background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); padding: 24px; }
    .bloc > h2, .seance-tete h2 {
      font-family: var(--titre); font-style: italic; font-size: 25px; margin: 0 0 14px; line-height: 1.15; text-wrap: balance;
      color: var(--texte);
    }
    .bloc h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--neon-clair); margin: 0 0 6px; }
    .texte { white-space: pre-line; color: var(--texte-doux); margin: 0; }

    /* Semaine */
    .semaine { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
    .jour { border-radius: 14px; padding: 12px 10px; background: var(--nuit-2); border: 1px solid var(--bord); display: grid; gap: 6px; align-content: start; position: relative; }
    .jour .nom { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; }
    .jour .contenu { font-size: 13px; color: var(--texte-doux); line-height: 1.35; }
    .jour .pastille { justify-self: start; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; letter-spacing: .05em; }
    .jour.bas { border-color: rgba(226, 92, 255, .55); box-shadow: inset 0 0 22px rgba(226, 92, 255, .14); }
    .jour.bas .pastille { background: var(--rose); color: #2a0533; }
    .jour.haut { border-color: rgba(180, 92, 255, .6); box-shadow: inset 0 0 22px rgba(180, 92, 255, .14); }
    .jour.haut .pastille { background: var(--neon); color: #1d0640; }
    .jour.repos { opacity: .75; }
    .jour.repos .pastille { background: var(--carte-2); color: var(--texte-pale); }

    .grille-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .encart { background: var(--nuit-2); border: 1px solid var(--bord); border-radius: 14px; padding: 16px; min-width: 0; }

    /* Séances */
    .seance { border-radius: 22px; padding: 22px; background: var(--carte); box-shadow: var(--lueur); }
    .seance.bas { --accent: var(--rose); }
    .seance.haut { --accent: var(--neon); }
    .seance-tete { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .seance-tete .gauche { display: flex; gap: 14px; align-items: center; min-width: 0; }
    .seance-tete .emoji { width: 52px; height: 52px; flex: none; display: grid; place-items: center; font-size: 26px; border-radius: 16px; background: var(--nuit-2); border: 1px solid var(--accent, var(--neon)); box-shadow: 0 0 16px color-mix(in srgb, var(--accent, var(--neon)) 45%, transparent); }
    .seance-tete h2 { margin: 0; }
    .seance-tete .focus { color: var(--texte-doux); font-size: 14px; }
    .seance-tete .jour-etiquette { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .14em; color: var(--accent, var(--neon)); }

    .tableau-zone { overflow-x: auto; border-radius: 14px; border: 1px solid var(--bord); }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    thead th {
      text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--neon-clair);
      background: var(--nuit-2); padding: 10px 10px; border-bottom: 1px solid var(--bord); white-space: nowrap;
    }
    tbody td { padding: 11px 10px; vertical-align: top; border-bottom: 1px solid rgba(180, 92, 255, .14); color: var(--texte-doux); }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:nth-child(even) td { background: rgba(255, 255, 255, .018); }
    td.num { width: 44px; }
    td.num span {
      display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 10px;
      font-weight: 700; color: var(--texte); background: var(--carte-2); border: 1px solid var(--accent, var(--neon));
      font-variant-numeric: tabular-nums;
    }
    tr.superset td.num span { background: color-mix(in srgb, var(--accent, var(--neon)) 30%, var(--carte-2)); }
    td.exo { font-weight: 700; color: var(--texte); min-width: 150px; }
    td.series { min-width: 110px; color: var(--texte); font-variant-numeric: tabular-nums; }
    td.tempo, td.repos { white-space: nowrap; font-variant-numeric: tabular-nums; }
    td.notes { min-width: 180px; font-size: 13px; }
    td.actions { width: 1%; white-space: nowrap; }
    .note-seance { margin: 12px 0 0; padding: 10px 14px; border-radius: 12px; background: rgba(255, 196, 107, .08); border: 1px dashed rgba(255, 196, 107, .45); color: #FFE2B3; font-size: 13.5px; }
    .note-seance::before { content: "⚡ "; }

    /* Cycle */
    .cycle { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
    .cycle .etape { border-radius: 14px; padding: 14px; background: var(--nuit-2); border: 1px solid var(--bord); display: grid; gap: 6px; align-content: start; }
    .cycle .etape b { font-family: var(--titre); font-style: italic; font-size: 22px; color: var(--neon-clair); }
    .cycle .etape span { font-size: 13px; color: var(--texte-doux); }
    .cycle .etape:last-child { border-color: var(--vert); }
    .cycle .etape:last-child b { color: var(--vert); }

    .alerte { margin: 14px 0; padding: 14px 16px; border-radius: 14px; background: rgba(226, 92, 255, .1); border: 1px solid rgba(226, 92, 255, .5); color: var(--texte); }

    .pied { text-align: center; color: var(--texte-pale); font-size: 12.5px; padding-top: 6px; }
    .pied b { font-family: var(--titre); font-style: italic; color: var(--neon-clair); font-size: 15px; }

    /* ---------- Mode édition ---------- */
    .edition-seule { display: none !important; }
    body.edition .edition-seule { display: revert !important; }
    body.edition td.actions { display: table-cell !important; }
    body.edition [data-champ] { outline: 1px dashed rgba(216, 168, 255, .45); outline-offset: 2px; border-radius: 4px; cursor: text; min-width: 1.5em; display: inline-block; }
    body.edition .texte[data-champ], body.edition td [data-champ] { display: block; }
    body.edition [data-champ]:hover { outline-color: var(--neon); }
    body.edition [data-champ]:focus { outline: 2px solid var(--neon); background: rgba(180, 92, 255, .1); }
    [data-champ]:empty::before { content: attr(data-vide); color: var(--texte-pale); font-style: italic; }
    .ajout-ligne { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .jour .changer-type { position: absolute; top: 6px; right: 6px; }
    .barre-seance { display: flex; gap: 6px; flex-wrap: wrap; }

    .toast {
      position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px);
      background: var(--carte-2); border: 1px solid var(--neon); color: var(--texte); padding: 10px 18px; border-radius: 999px;
      opacity: 0; transition: .25s; pointer-events: none; z-index: 50; box-shadow: 0 0 20px rgba(180, 92, 255, .4);
    }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }

    .confirm { position: fixed; inset: 0; background: rgba(5, 1, 14, .7); display: grid; place-items: center; z-index: 60; padding: 16px; }
    .confirm .boite { max-width: 380px; background: var(--carte); border: 1px solid var(--neon); border-radius: 18px; padding: 22px; box-shadow: var(--lueur); display: grid; gap: 14px; }
    .confirm .boite div { display: flex; gap: 8px; justify-content: flex-end; }

    @media (max-width: 860px) {
      .semaine { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .entete { grid-template-columns: 1fr; }
      .cycle { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .grille-2 { grid-template-columns: 1fr; }
      .bloc, .seance { padding: 16px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

    /* ---------- Impression / PDF ---------- */
    @page { size: A4; margin: 0; }
    @media print {
      body { padding: 10mm 10mm 6mm; font-size: 11.5px; background: var(--nuit); background-attachment: scroll; }
      .outils, .toast, .confirm, .edition-seule, td.actions { display: none !important; }
      [data-champ] { outline: none !important; background: none !important; }
      .doc { max-width: none; gap: 14px; }
      .entete { padding: 18px; gap: 18px; grid-template-columns: 1.1fr 1fr; }
      .entete h1 { font-size: 32px; }
      .bloc, .seance { padding: 16px; break-inside: avoid; }
      .seance { box-shadow: 0 0 0 1px rgba(180, 92, 255, .6); }
      .seance.saut { break-before: page; }
      .semaine { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
      .jour { padding: 8px 7px; }
      .jour .contenu { font-size: 10.5px; }
      .grille-2 { grid-template-columns: 1fr 1fr; }
      .cycle { grid-template-columns: repeat(4, 1fr); }
      table { font-size: 11px; }
      tbody td { padding: 7px 8px; }
      td.notes { font-size: 10.5px; }
      tr { break-inside: avoid; }
      .tableau-zone { overflow: visible; }
    }
  </style>
</head>
<body>
  <div class="outils" id="outils">
    <button class="btn" id="btn-edition" type="button">✏️ Modifier le programme</button>
    <button class="btn principal" id="btn-pdf" type="button">📄 Télécharger en PDF</button>
    <button class="btn" id="btn-logo" type="button">🖼️ Changer le logo</button>
    <button class="btn" id="btn-export" type="button">💾 Sauvegarder (fichier)</button>
    <button class="btn" id="btn-import" type="button">📂 Ouvrir un programme</button>
    <button class="btn danger" id="btn-reset" type="button">↺ Programme d'origine</button>
    <input type="file" id="fichier-logo" accept="image/*" hidden />
    <input type="file" id="fichier-json" accept="application/json,.json" hidden />
    <p class="astuce" id="astuce">Les modifications sont enregistrées automatiquement dans ce navigateur.</p>
  </div>

  <main class="doc" id="doc"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

     ================================================================= */
  const CLE = "bootyflow-programme-v1";
  const CLE_LOGO = "bootyflow-programme-logo";
  const copie = o => JSON.parse(JSON.stringify(o));
  let P = charger();
  let logo = lireStock(CLE_LOGO) || LOGO_DEFAUT;
  let edition = false;

  function lireStock(cle) { try { return localStorage.getItem(cle); } catch (e) { return null; } }
  function ecrireStock(cle, val) { try { localStorage.setItem(cle, val); } catch (e) {} }
  function charger() {
    try { const s = lireStock(CLE); if (s) return JSON.parse(s); } catch (e) {}
    return copie(PROGRAMME_DEFAUT);
  }
  function sauver() { ecrireStock(CLE, JSON.stringify(P)); }

  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // Champ modifiable : chemin dans l'objet P, ex. "seances.0.exercices.2.nom"
  const champ = (chemin, vide = "…", tag = "span", cls = "") => {
    const val = chemin.split(".").reduce((o, k) => o?.[k], P);
    return `<${tag} class="${cls}" data-champ="${chemin}" data-vide="${esc(vide)}">${esc(val)}</${tag}>`;
  };
  const TYPES = { bas: "BAS", haut: "HAUT", repos: "REPOS" };

  function rendu() {
    const d = document.getElementById("doc");
    d.innerHTML = `
      <header class="entete">
        <div>
          <div class="surtitre">${champ("coach", "Nom du coaching")}</div>
          <h1>${champ("titre", "Titre du programme")}</h1>
          <p class="sous">${champ("sousTitre", "Sous-titre")}</p>
          <div class="eleve"><span>Programme de</span><b>${champ("eleve", "Prénom")}</b></div>
        </div>
        <img class="logo" src="${logo}" alt="Logo Booty Flow Coaching" />
      </header>

      <section class="bloc">
        <h2>Ta semaine type</h2>
        <div class="semaine">
          ${P.semaine.map((j, i) => `
            <div class="jour ${j.type}">
              <button class="btn icone petit changer-type edition-seule" type="button" data-action="type-jour" data-i="${i}" title="Changer : bas / haut / repos">⇄</button>
              <span class="nom">${champ(`semaine.${i}.jour`, "Jour")}</span>
              <span class="pastille">${TYPES[j.type] || j.type}</span>
              <span class="contenu">${champ(`semaine.${i}.seance`, "Séance")}</span>
            </div>`).join("")}
        </div>
      </section>

      <section class="bloc">
        <h2>Organisation des séances</h2>
        <div class="grille-2">
          <div class="encart"><h3>Structure</h3>${champ("structure", "Texte", "p", "texte")}</div>
          <div class="encart"><h3>Notation</h3>${champ("notation", "Texte", "p", "texte")}</div>
          <div class="encart"><h3>Échauffement · jours bas (10 min)</h3>${champ("echauffementBas", "Texte", "p", "texte")}</div>
          <div class="encart"><h3>Échauffement · jours haut (10 min)</h3>${champ("echauffementHaut", "Texte", "p", "texte")}</div>
        </div>
      </section>

      ${P.seances.map((s, si) => `
        <section class="seance ${s.type} ${si === 0 ? "saut" : ""}">
          <div class="seance-tete">
            <div class="gauche">
              <div class="emoji">${champ(`seances.${si}.emoji`, "🍑")}</div>
              <div>
                <div class="jour-etiquette">${champ(`seances.${si}.jour`, "Jour")}</div>
                <h2>${champ(`seances.${si}.titre`, "Nom de la séance")}</h2>
                <div class="focus">${champ(`seances.${si}.focus`, "Objectif")}</div>
              </div>
            </div>
            <div class="barre-seance edition-seule">
              <button class="btn petit" type="button" data-action="type-seance" data-s="${si}">⇄ ${s.type === "bas" ? "Bas" : "Haut"}</button>
              <button class="btn icone petit" type="button" data-action="monter-seance" data-s="${si}" title="Monter la séance">↑</button>
              <button class="btn icone petit" type="button" data-action="descendre-seance" data-s="${si}" title="Descendre la séance">↓</button>
              <button class="btn icone petit danger" type="button" data-action="suppr-seance" data-s="${si}" title="Supprimer la séance">🗑</button>
            </div>
          </div>
          <div class="tableau-zone">
            <table>
              <thead><tr><th>#</th><th>Exercice</th><th>Séries × reps</th><th>Tempo</th><th>Repos</th><th>Notes</th><th class="edition-seule"></th></tr></thead>
              <tbody>
                ${s.exercices.map((e, ei) => `
                  <tr class="${/[a-z]$/i.test(e.n) ? "superset" : ""}">
                    <td class="num"><span>${champ(`seances.${si}.exercices.${ei}.n`, "#")}</span></td>
                    <td class="exo">${champ(`seances.${si}.exercices.${ei}.nom`, "Nom de l'exercice")}</td>
                    <td class="series">${champ(`seances.${si}.exercices.${ei}.series`, "3 × 10")}</td>
                    <td class="tempo">${champ(`seances.${si}.exercices.${ei}.tempo`, "—")}</td>
                    <td class="repos">${champ(`seances.${si}.exercices.${ei}.repos`, "—")}</td>
                    <td class="notes">${champ(`seances.${si}.exercices.${ei}.notes`, "")}</td>
                    <td class="actions edition-seule">
                      <button class="btn icone petit" type="button" data-action="monter" data-s="${si}" data-e="${ei}" title="Monter">↑</button>
                      <button class="btn icone petit" type="button" data-action="descendre" data-s="${si}" data-e="${ei}" title="Descendre">↓</button>
                      <button class="btn icone petit danger" type="button" data-action="suppr" data-s="${si}" data-e="${ei}" title="Supprimer l'exercice">🗑</button>
                    </td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>
          ${s.note || edition ? `<p class="note-seance">${champ(`seances.${si}.note`, "Ajouter une consigne pour cette séance (facultatif)")}</p>` : ""}
          <div class="ajout-ligne edition-seule">
            <button class="btn petit principal" type="button" data-action="ajout" data-s="${si}">＋ Ajouter un exercice</button>
            <button class="btn petit" type="button" data-action="ajout-superset" data-s="${si}">＋ Ajouter un superset (a + b)</button>
          </div>
        </section>`).join("")}

      <div class="ajout-ligne edition-seule" style="justify-content:center">
        <button class="btn principal" type="button" data-action="ajout-seance" data-type="bas">＋ Nouvelle séance bas</button>
        <button class="btn principal" type="button" data-action="ajout-seance" data-type="haut">＋ Nouvelle séance haut</button>
      </div>

      <section class="bloc saut">
        <h2>Progression</h2>
        ${champ("progression", "Texte", "p", "texte")}
        <div class="cycle">
          ${P.cycle.map((c, i) => `
            <div class="etape"><b>${champ(`cycle.${i}.semaines`, "S1")}</b><span>${champ(`cycle.${i}.objectif`, "Objectif")}</span></div>`).join("")}
        </div>
      </section>

      <section class="bloc">
        <h2>🔄 Semaine de décharge (S8)</h2>
        ${champ("decharge", "Texte", "p", "texte")}
        <div class="alerte">${champ("alerte", "Message important")}</div>
        <div class="grille-2">
          <div class="encart" style="grid-column:1/-1"><h3>Pourquoi une décharge ?</h3>${champ("pourquoi", "Texte", "p", "texte")}</div>
          ${P.regles.map((r, i) => `
            <div class="encart"><h3>${champ(`regles.${i}.titre`, "Titre")}</h3>${champ(`regles.${i}.texte`, "Texte", "p", "texte")}</div>`).join("")}
        </div>
      </section>

      <footer class="pied"><b>${esc(P.coach)}</b><br />Programme personnalisé de ${esc(P.eleve)} · ne pas diffuser</footer>
    `;
    document.body.classList.toggle("edition", edition);
    d.querySelectorAll("[data-champ]").forEach(el => {
      if (edition) { el.setAttribute("contenteditable", "plaintext-only"); if (el.contentEditable !== "plaintext-only") el.setAttribute("contenteditable", "true"); }
    });
  }

  // Saisie dans un champ
  document.getElementById("doc").addEventListener("input", e => {
    const el = e.target.closest("[data-champ]");
    if (!el) return;
    const cles = el.dataset.champ.split(".");
    const der = cles.pop();
    const obj = cles.reduce((o, k) => o[k], P);
    obj[der] = el.innerText.replace(/\n$/, "");
    sauver();
  });
  // Entrée = nouvelle ligne seulement dans les textes longs
  document.getElementById("doc").addEventListener("keydown", e => {
    const el = e.target.closest("[data-champ]");
    if (el && e.key === "Enter" && !el.classList.contains("texte")) { e.preventDefault(); el.blur(); }
  });
  // Les numéros changent la mise en forme des supersets : on redessine en quittant le champ
  document.getElementById("doc").addEventListener("focusout", e => {
    const el = e.target.closest?.("[data-champ]");
    if (el && /\.n$/.test(el.dataset.champ)) rendu();
  });

  const nouvelExo = n => ({ n, nom: "", series: "3 × 10-12", tempo: "2 s", repos: "90 s", notes: "" });
  function numeroSuivant(liste) {
    const max = liste.reduce((m, e) => Math.max(m, parseInt(e.n, 10) || 0), 0);
    return max + 1;
  }
  const echange = (t, i, j) => { if (j < 0 || j >= t.length) return; [t[i], t[j]] = [t[j], t[i]]; };

  document.getElementById("doc").addEventListener("click", e => {
    const b = e.target.closest("[data-action]");
    if (!b) return;
    const s = +b.dataset.s, ex = +b.dataset.e, seance = P.seances[s];
    switch (b.dataset.action) {
      case "ajout": seance.exercices.push(nouvelExo(String(numeroSuivant(seance.exercices)))); break;
      case "ajout-superset": {
        const n = numeroSuivant(seance.exercices);
        const a = nouvelExo(n + "a"); a.repos = "0"; a.notes = `Enchaîner avec le ${n}b`;
        seance.exercices.push(a, nouvelExo(n + "b"));
        break;
      }
      case "suppr": {
        const nom = seance.exercices[ex].nom || "cet exercice";
        return demander(`Supprimer « ${nom} » ?`, () => { seance.exercices.splice(ex, 1); maj(); });
      }
      case "monter": echange(seance.exercices, ex, ex - 1); break;
      case "descendre": echange(seance.exercices, ex, ex + 1); break;
      case "type-seance": seance.type = seance.type === "bas" ? "haut" : "bas"; break;
      case "monter-seance": echange(P.seances, s, s - 1); break;
      case "descendre-seance": echange(P.seances, s, s + 1); break;
      case "suppr-seance":
        return demander(`Supprimer toute la séance « ${seance.titre} » ?`, () => { P.seances.splice(s, 1); maj(); });
      case "ajout-seance": {
        const t = b.dataset.type;
        P.seances.push({ emoji: t === "bas" ? "🍑" : "💪", type: t, jour: "Jour", titre: t === "bas" ? "Nouvelle séance bas" : "Nouvelle séance haut", focus: "", note: "", exercices: [nouvelExo("1")] });
        break;
      }
      case "type-jour": {
        const j = P.semaine[+b.dataset.i], ordre = ["bas", "haut", "repos"];
        j.type = ordre[(ordre.indexOf(j.type) + 1) % 3];
        break;
      }
    }
    maj();
    if (b.dataset.action.startsWith("ajout")) {
      // place le curseur sur le nouvel exercice
      const champs = document.querySelectorAll(b.dataset.action === "ajout-seance" ? '[data-champ$=".titre"]' : `[data-champ^="seances.${s}.exercices."][data-champ$=".nom"]`);
      const cible = b.dataset.action === "ajout-superset" ? champs[champs.length - 2] : champs[champs.length - 1];
      cible?.focus();
      cible?.scrollIntoView({ block: "center", behavior: "smooth" });
    }
  });
  function maj() { sauver(); rendu(); }

  // Petite fenêtre de confirmation (confirm() est bloqué dans certains navigateurs intégrés)
  function demander(message, ok) {
    const f = document.createElement("div");
    f.className = "confirm";
    f.innerHTML = `<div class="boite" role="dialog" aria-modal="true"><p style="margin:0">${esc(message)}</p><div><button class="btn" type="button">Annuler</button><button class="btn principal" type="button">Confirmer</button></div></div>`;
    const [non, oui] = f.querySelectorAll("button");
    non.onclick = () => f.remove();
    oui.onclick = () => { f.remove(); ok(); };
    f.onclick = e => { if (e.target === f) f.remove(); };
    document.body.appendChild(f);
    oui.focus();
  }
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("visible");
    clearTimeout(t._m); t._m = setTimeout(() => t.classList.remove("visible"), 2200);
  }

  // Barre d'outils
  const btnEd = document.getElementById("btn-edition");
  btnEd.onclick = () => {
    edition = !edition;
    btnEd.textContent = edition ? "✅ Terminer les modifications" : "✏️ Modifier le programme";
    btnEd.classList.toggle("actif", edition);
    document.getElementById("astuce").textContent = edition
      ? "Clique sur n'importe quel texte pour le modifier. Numérote « 5a » / « 5b » pour un superset."
      : "Les modifications sont enregistrées automatiquement dans ce navigateur.";
    rendu();
  };
  document.getElementById("btn-pdf").onclick = () => {
    if (edition) btnEd.click();
    const ancien = document.title;
    document.title = `Programme ${P.eleve} - ${P.coach}`;
    window.print();
    setTimeout(() => { document.title = ancien; }, 1000);
  };
  document.getElementById("btn-logo").onclick = () => document.getElementById("fichier-logo").click();
  document.getElementById("fichier-logo").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { logo = r.result; ecrireStock(CLE_LOGO, logo); rendu(); toast("Logo mis à jour"); };
    r.readAsDataURL(f);
    e.target.value = "";
  };
  document.getElementById("btn-export").onclick = () => {
    const blob = new Blob([JSON.stringify(P, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `programme-${(P.eleve || "eleve").toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g, "-")}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast("Fichier du programme téléchargé");
  };
  document.getElementById("btn-import").onclick = () => document.getElementById("fichier-json").click();
  document.getElementById("fichier-json").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(t => {
      try {
        const d = JSON.parse(t);
        if (!Array.isArray(d.seances)) throw new Error();
        P = Object.assign(copie(PROGRAMME_DEFAUT), d); maj(); toast(`Programme de ${P.eleve} ouvert`);
      } catch (err) { toast("Ce fichier n'est pas un programme Booty Flow"); }
    });
    e.target.value = "";
  };
  document.getElementById("btn-reset").onclick = () =>
    demander("Revenir au programme d'origine ? Tes modifications seront effacées.", () => {
      P = copie(PROGRAMME_DEFAUT); logo = LOGO_DEFAUT;
      try { localStorage.removeItem(CLE); localStorage.removeItem(CLE_LOGO); } catch (e) {}
      rendu(); toast("Programme d'origine restauré");
    });

  rendu();
  </script>
</body>
</html>
