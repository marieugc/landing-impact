</head>
<body>
  <a class="lien-evitement" href="#contenu">Aller au contenu</a>

  <header class="entete" id="entete">
    <div class="entete__ligne">
      <button type="button" class="retour" id="retour" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="retour-texte">Retour</span>
      </button>
      <img class="entete__logo" id="entete-logo" src="assets/logo.webp" alt="Booty Flow Coaching" width="900" height="425" />
      <span class="entete__cale" aria-hidden="true"></span>
    </div>
    <div class="progression" id="progression" hidden>
      <div class="progression__texte" id="progression-texte" aria-hidden="true"></div>
      <div class="progression__barre" role="progressbar" id="progression-barre"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progression du test">
        <span class="progression__remplissage" id="progression-remplissage"></span>
      </div>
    </div>
  </header>

  <main id="contenu" class="scene" tabindex="-1">
    <!-- Les écrans sont générés par script.js à partir de config.js -->
    <noscript>
      <p class="noscript">Active JavaScript pour découvrir ton diagnostic personnalisé 💜</p>
    </noscript>
  </main>

  <div class="annonce" id="annonce" aria-live="polite" role="status"></div>

  <footer class="pied" id="pied"></footer>

  <script src="config.js?v=1"></script>
  <script src="script.js?v=1"></script>
</body>
